$kind: http-request
url: "{{base_url}}/items"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: '{"name":"Laptop","sku":"{{sku}}","quantity":5,"price":7500000,"description":"Laptop kantor"}'
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('sku', 'SKU-' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('item_id', pm.response.json().data.id);
    language: text/javascript
order: 3000
